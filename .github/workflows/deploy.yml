name: Scrape HeterodoxNews & Deploy to GitHub Pages

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# and pushing the data commits that keep the scheduled workflow alive.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Newsletter Scraper & RSS Generator
        run: |
          set -uo pipefail
          # The newsletter host occasionally drops requests from CI runners,
          # and the scraper now fails hard on incomplete data by design.
          # Retry the whole run before giving up.
          for attempt in 1 2 3; do
            echo "::group::Scraper attempt ${attempt}/3"
            if python3 scripts/scraper.py; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt ${attempt} failed (transient network/source error). Retrying in 30s..."
              sleep 30
            fi
          done
          echo "Scraper failed after 3 attempts." >&2
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: |
          pnpm install

      - name: Build Web Portal with Vite
        run: |
          pnpm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Persist the regenerated feeds/dataset so the repository does not drift
      # from what is published. Only commits when a new issue actually appears,
      # because data.json embeds updated_at and would otherwise look dirty daily.
      - name: Commit generated feeds when a new issue is published
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -f public/data.json ] || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          new_issue=$(python3 -c "import json;print(json.load(open('public/data.json'))['metadata']['latest_issue'])")
          old_issue=$(git show HEAD:public/data.json | python3 -c "import json,sys;print(json.load(sys.stdin)['metadata']['latest_issue'])" || echo "")

          echo "Latest issue in repo: ${old_issue:-unknown} | scraped: ${new_issue}"
          if [ "$new_issue" = "$old_issue" ]; then
            echo "No new issue, nothing to commit."
            exit 0
          fi

          git add public/
          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "Auto-update HeterodoxNews feeds and dataset [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # GitHub disables `schedule` triggers in public repos after 60 days without
      # repository activity. Committing a tiny heartbeat when the repo has been
      # idle for 45 days keeps the cron alive (e.g. during newsletter breaks).
      - name: Keep the scheduled workflow alive
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          last_commit=$(git log -1 --format=%ct)
          idle_days=$(( ($(date +%s) - last_commit) / 86400 ))
          echo "Last repository activity: ${idle_days} day(s) ago."

          if [ "$idle_days" -lt 45 ]; then
            echo "Activity is recent enough, no keepalive needed."
            exit 0
          fi

          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive to preserve scheduled workflow [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
